name: Rebuild & Deploy

on:
  schedule:
    - cron: '0 */4 * * *' # Every 4 hours
  workflow_dispatch:
    inputs:
      rebuild_dev:
        description: 'Rebuild dev branch'
        type: boolean
        default: true
      rebuild_staging:
        description: 'Rebuild staging branch'
        type: boolean
        default: false
      deploy_alpha:
        description: 'Deploy to Alpha'
        type: boolean
        default: true
      deploy_staging:
        description: 'Deploy to Staging'
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write

env:
  GIT_AUTHOR_NAME: github-actions[bot]
  GIT_AUTHOR_EMAIL: github-actions[bot]@users.noreply.github.com
  GIT_COMMITTER_NAME: github-actions[bot]
  GIT_COMMITTER_EMAIL: github-actions[bot]@users.noreply.github.com

jobs:
  rebuild-dev:
    name: Rebuild dev
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event.inputs.rebuild_dev == 'true'
    outputs:
      merged_topics: ${{ steps.rebuild.outputs.merged_topics }}
      conflicted_topics: ${{ steps.rebuild.outputs.conflicted_topics }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git
        run: |
          git config user.name "$GIT_AUTHOR_NAME"
          git config user.email "$GIT_AUTHOR_EMAIL"
          git config rerere.enabled true

      - name: Get topics with ready-for-integration label
        id: get_topics
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          topics=$(gh pr list --label "ready-for-integration" --json headRefName --jq '.[].headRefName' | sort -u)
          echo "topics<<EOF" >> $GITHUB_OUTPUT
          echo "$topics" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
          echo "Found topics: $topics"

      - name: Get topics in staging
        id: staging_topics
        run: |
          git fetch origin staging master
          topics=$(git log origin/master..origin/staging --merges --first-parent --pretty=format:'%s' | \
            grep -oE "Merge branch '[^']+" | sed "s/Merge branch '//g" | sort -u || true)
          echo "topics<<EOF" >> $GITHUB_OUTPUT
          echo "$topics" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
          echo "Staging topics: $topics"

      - name: Rebuild dev branch
        id: rebuild
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e

          merged_topics=""
          conflicted_topics=""
          conflict_details=""

          # Reset dev to master
          git checkout -B dev origin/master

          # Phase 1: Merge topics from staging first
          echo "=== Phase 1: Topics from staging ==="
          staging_topics="${{ steps.staging_topics.outputs.topics }}"
          for topic in $staging_topics; do
            if [ -z "$topic" ]; then continue; fi
            if git rev-parse --verify "origin/$topic" &>/dev/null; then
              # Skip if already in master
              if git merge-base --is-ancestor "origin/$topic" origin/master 2>/dev/null; then
                echo "Skipping $topic (already in master)"
                continue
              fi
              echo "Merging (from staging): $topic"
              if git merge --no-ff --no-edit "origin/$topic" -m "Merge branch '$topic' into dev"; then
                merged_topics="$merged_topics $topic"
              else
                echo "Conflict with staging topic: $topic"
                git merge --abort
              fi
            fi
          done

          # Marker commit
          git commit --allow-empty -m "### Match 'staging'" || true

          # Phase 2: Merge labeled topics
          echo "=== Phase 2: Labeled topics ==="
          labeled_topics="${{ steps.get_topics.outputs.topics }}"
          last_merged=""

          for topic in $labeled_topics; do
            if [ -z "$topic" ]; then continue; fi

            # Skip if already merged in phase 1
            if echo "$merged_topics" | grep -qw "$topic"; then
              echo "Skipping $topic (already merged from staging)"
              continue
            fi

            if git rev-parse --verify "origin/$topic" &>/dev/null; then
              # Skip if already in master
              if git merge-base --is-ancestor "origin/$topic" origin/master 2>/dev/null; then
                echo "Skipping $topic (already in master)"
                continue
              fi

              # Skip if already in HEAD
              if git merge-base --is-ancestor "origin/$topic" HEAD 2>/dev/null; then
                echo "Skipping $topic (already in dev)"
                merged_topics="$merged_topics $topic"
                continue
              fi

              echo "Merging: $topic"
              if git merge --no-ff --no-edit "origin/$topic" -m "Merge branch '$topic' into dev"; then
                merged_topics="$merged_topics $topic"
                last_merged="$topic"
              else
                echo "CONFLICT detected with $topic"
                git merge --abort
                conflicted_topics="$conflicted_topics $topic"
                conflict_details="$conflict_details|$topic:$last_merged"

                # Get PR number and update labels
                pr_number=$(gh pr list --head "$topic" --json number --jq '.[0].number')
                if [ -n "$pr_number" ]; then
                  gh pr edit "$pr_number" --remove-label "ready-for-integration" || true
                  gh pr edit "$pr_number" --add-label "has-conflict" || true

                  # Post conflict comment
                  gh pr comment "$pr_number" --body "## Merge Conflict in Integration Branch

          Your branch \`$topic\` could not be merged into \`dev\` due to a merge conflict.

          **What this means:**
          - Your code is NOT currently deployed to the Alpha server
          - The \`ready-for-integration\` label has been removed
          - You need to resolve the conflict before your code can be integrated

          **How to fix:**

          \`\`\`bash
          git checkout $topic
          git fetch origin
          git rebase origin/master
          # Resolve conflicts...
          git push --force-with-lease
          \`\`\`

          **Conflicting with:** \`$last_merged\` (or earlier topic)

          Once you push the fix, CI will re-run and re-add the \`ready-for-integration\` label if all checks pass."
                fi
              fi
            fi
          done

          # Force push dev
          git push origin dev --force-with-lease

          # Set outputs
          echo "merged_topics=$merged_topics" >> $GITHUB_OUTPUT
          echo "conflicted_topics=$conflicted_topics" >> $GITHUB_OUTPUT

          echo "=== Rebuild Summary ==="
          echo "Merged: $merged_topics"
          echo "Conflicted: $conflicted_topics"

      - name: Post deployment comments
        if: steps.rebuild.outputs.merged_topics != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for topic in ${{ steps.rebuild.outputs.merged_topics }}; do
            pr_number=$(gh pr list --head "$topic" --json number --jq '.[0].number')
            if [ -n "$pr_number" ]; then
              # Check if we already commented recently (avoid spam)
              recent=$(gh pr view "$pr_number" --json comments --jq '.comments[-1].body' 2>/dev/null || echo "")
              if ! echo "$recent" | grep -q "deployed to Alpha"; then
                gh pr comment "$pr_number" --body "Deployed to **Alpha** environment via \`dev\` branch rebuild.

          - Commit: \`$(git rev-parse --short HEAD)\`
          - Time: $(date -u '+%Y-%m-%d %H:%M UTC')"
              fi
            fi
          done

  deploy-alpha:
    name: Deploy Alpha
    runs-on: ubuntu-latest
    needs: rebuild-dev
    if: |
      (github.event_name == 'schedule' || github.event.inputs.deploy_alpha == 'true') &&
      needs.rebuild-dev.result == 'success'
    environment:
      name: alpha
      url: https://alpha.yourapp.com
    steps:
      - name: Checkout dev
        uses: actions/checkout@v4
        with:
          ref: dev

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build

      - name: Deploy to Alpha
        run: |
          echo "Deploying to Alpha server..."
          # Add your deployment commands here:
          # - rsync to server
          # - docker push & pull
          # - vercel/netlify deploy
          # - kubectl apply
          echo "Deployment placeholder - configure your deployment method"

  rebuild-staging:
    name: Rebuild staging
    runs-on: ubuntu-latest
    if: github.event.inputs.rebuild_staging == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git
        run: |
          git config user.name "$GIT_AUTHOR_NAME"
          git config user.email "$GIT_AUTHOR_EMAIL"
          git config rerere.enabled true

      - name: Rebuild staging branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e

          git fetch origin staging master

          # Get topics currently in staging that haven't graduated
          topics=$(git log origin/master..origin/staging --merges --first-parent --pretty=format:'%s' | \
            grep -oE "Merge branch '[^']+" | sed "s/Merge branch '//g" | sort -u || true)

          echo "Topics to re-merge: $topics"

          # Reset staging to master
          git checkout -B staging origin/master

          # Re-merge non-graduated topics
          for topic in $topics; do
            if [ -z "$topic" ]; then continue; fi
            if git rev-parse --verify "origin/$topic" &>/dev/null; then
              if ! git merge-base --is-ancestor "origin/$topic" origin/master 2>/dev/null; then
                echo "Merging: $topic"
                git merge --no-ff --no-edit "origin/$topic" -m "Merge branch '$topic' into staging" || git merge --abort
              else
                echo "Skipping $topic (already in master)"
              fi
            else
              echo "Branch $topic no longer exists, skipping"
            fi
          done

          git push origin staging --force-with-lease

  deploy-staging:
    name: Deploy Staging
    runs-on: ubuntu-latest
    needs: rebuild-staging
    if: |
      github.event.inputs.deploy_staging == 'true' &&
      needs.rebuild-staging.result == 'success'
    environment:
      name: staging
      url: https://staging.yourapp.com
    steps:
      - name: Checkout staging
        uses: actions/checkout@v4
        with:
          ref: staging

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build

      - name: Deploy to Staging
        run: |
          echo "Deploying to Staging server..."
          # Add your deployment commands here
          echo "Deployment placeholder - configure your deployment method"
