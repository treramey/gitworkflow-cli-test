name: PR Checks

on:
  pull_request:
    branches:
      - master
      - maint
      - 'maint-*'
    types: [opened, synchronize, reopened, ready_for_review, labeled]
  pull_request_review:
    types: [submitted]

permissions:
  contents: read
  pull-requests: write
  checks: write
  actions: write

env:
  CI: true

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    if: |
      github.event.pull_request.draft == false &&
      github.event.action != 'labeled'
    outputs:
      passed: ${{ steps.result.outputs.passed }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Type check
        run: bun run check-types

      - name: Build
        run: bun run build

      - name: Set result
        id: result
        if: success()
        run: echo "passed=true" >> $GITHUB_OUTPUT

  pr-labels:
    name: pr-labels
    runs-on: ubuntu-latest
    needs: [build]
    if: always()
    env:
      REPO: ${{ github.repository }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_PRIVATE_KEY }}

      - name: Get PR base ref
        id: pr_info
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          # github.base_ref is empty for pull_request_review events
          # Get it from the PR itself
          base_ref=$(gh api repos/$REPO/pulls/$PR_NUMBER --jq '.base.ref')
          echo "base_ref=$base_ref" >> $GITHUB_OUTPUT

      - name: Check build status
        id: build_status
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          # If build ran this workflow, use its output
          if [ "${{ needs.build.outputs.passed }}" == "true" ]; then
            echo "passed=true" >> $GITHUB_OUTPUT
          elif [ "${{ needs.build.result }}" == "skipped" ]; then
            # Build skipped (label event) - check if status: ci-passed label exists
            labels=$(gh api repos/$REPO/pulls/$PR_NUMBER --jq '.labels[].name')
            if echo "$labels" | grep -qF "status: ci-passed"; then
              echo "passed=true" >> $GITHUB_OUTPUT
            else
              echo "passed=false" >> $GITHUB_OUTPUT
            fi
          else
            echo "passed=false" >> $GITHUB_OUTPUT
          fi

      - name: Check review status
        id: review_status
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          reviews=$(gh api repos/$REPO/pulls/$PR_NUMBER/reviews)
          # Filter out dismissed approvals
          approved=$(echo "$reviews" | jq '[.[] | select(.state == "APPROVED" and .dismissedAt == null)] | length')
          if [ "$approved" -gt 0 ]; then
            echo "approved=true" >> $GITHUB_OUTPUT
          else
            echo "approved=false" >> $GITHUB_OUTPUT
          fi

      - name: Update labels
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          BASE_REF: ${{ steps.pr_info.outputs.base_ref }}
        run: |
          # Build labels
          if [ "${{ steps.build_status.outputs.passed }}" == "true" ]; then
            gh pr edit $PR_NUMBER --repo $REPO \
              --remove-label "status: ci-failed,status: conflict" \
              --add-label "status: ci-passed" 2>/dev/null || true
          else
            gh pr edit $PR_NUMBER --repo $REPO \
              --remove-label "status: ci-passed" \
              --add-label "status: ci-failed" 2>/dev/null || true
          fi

          # Ready for dev integration (CI pass only, no approval required)
          # Only add env: dev for PRs targeting master (not hotfixes to maint)
          if [ "$BASE_REF" == "master" ]; then
            if [ "${{ steps.build_status.outputs.passed }}" == "true" ]; then
              gh pr edit $PR_NUMBER --repo $REPO \
                --add-label "env: dev" 2>/dev/null || true
            fi
          fi

          # Track review status for visibility (but not gating dev)
          if [ "${{ steps.review_status.outputs.approved }}" != "true" ]; then
            gh pr edit $PR_NUMBER --repo $REPO \
              --add-label "status: needs-review" 2>/dev/null || true
          else
            gh pr edit $PR_NUMBER --repo $REPO \
              --remove-label "status: needs-review" 2>/dev/null || true
          fi

      - name: Check staging status
        id: staging_status
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          labels=$(gh api repos/$REPO/pulls/$PR_NUMBER --jq '.labels[].name')
          if echo "$labels" | grep -qF "env: staging"; then
            echo "in_staging=true" >> $GITHUB_OUTPUT
          else
            echo "in_staging=false" >> $GITHUB_OUTPUT
          fi

      - name: Check dev status
        id: dev_status
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          labels=$(gh api repos/$REPO/pulls/$PR_NUMBER --jq '.labels[].name')
          if echo "$labels" | grep -qF "env: dev"; then
            echo "in_dev=true" >> $GITHUB_OUTPUT
          else
            echo "in_dev=false" >> $GITHUB_OUTPUT
          fi

    outputs:
      build_passed: ${{ steps.build_status.outputs.passed }}
      approved: ${{ steps.review_status.outputs.approved }}
      in_dev: ${{ steps.dev_status.outputs.in_dev }}
      in_staging: ${{ steps.staging_status.outputs.in_staging }}
      base_ref: ${{ steps.pr_info.outputs.base_ref }}

  # Trigger dev rebuild when CI passes (since workflow-added labels don't trigger events)
  trigger-dev-rebuild:
    name: trigger-dev-rebuild
    runs-on: ubuntu-latest
    needs: [pr-labels]
    if: |
      needs.pr-labels.outputs.build_passed == 'true' &&
      needs.pr-labels.outputs.base_ref == 'master' &&
      github.event.action != 'labeled'
    steps:
      - name: Trigger rebuild workflow
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Triggering dev rebuild..."
          gh workflow run rebuild-and-deploy.yml \
            --repo ${{ github.repository }} \
            --field rebuild_dev=true

  # Merge gate for PRs to master
  # Requires: CI passed + env: dev + env: staging + PR approval
  rebuild-gate:
    name: rebuild-gate
    runs-on: ubuntu-latest
    needs: [pr-labels]
    if: always() && needs.pr-labels.outputs.base_ref == 'master'
    steps:
      - name: Check merge requirements
        run: |
          echo "Checking merge requirements..."
          echo "  CI passed: ${{ needs.pr-labels.outputs.build_passed }}"
          echo "  In dev: ${{ needs.pr-labels.outputs.in_dev }}"
          echo "  In staging: ${{ needs.pr-labels.outputs.in_staging }}"
          echo "  Approved: ${{ needs.pr-labels.outputs.approved }}"

          missing=""

          if [ "${{ needs.pr-labels.outputs.build_passed }}" != "true" ]; then
            missing="$missing\n  - CI must pass (status: ci-passed)"
          fi

          if [ "${{ needs.pr-labels.outputs.in_dev }}" != "true" ]; then
            missing="$missing\n  - Must be in dev (env: dev label)"
          fi

          if [ "${{ needs.pr-labels.outputs.in_staging }}" != "true" ]; then
            missing="$missing\n  - Must be in staging (env: staging label)"
          fi

          if [ "${{ needs.pr-labels.outputs.approved }}" != "true" ]; then
            missing="$missing\n  - PR approval required"
          fi

          if [ -n "$missing" ]; then
            echo "::error::PR not ready to merge. Missing requirements:"
            echo -e "$missing"
            echo ""
            echo "Flow to merge:"
            echo "  1. CI must pass (auto-adds env: dev)"
            echo "  2. Topic merges to dev on next rebuild"
            echo "  3. Manually add env: staging label when ready"
            echo "  4. Topic merges to staging on daily rebuild (or manual trigger)"
            echo "  5. Get PR approval"
            echo "  6. Merge allowed"
            exit 1
          fi

          echo "All merge requirements met"

  # Merge gate for hotfix PRs to maint (CI + approval only, no staging)
  require-hotfix-approval:
    name: require-hotfix-approval
    runs-on: ubuntu-latest
    needs: [pr-labels]
    if: always() && (needs.pr-labels.outputs.base_ref == 'maint' || startsWith(needs.pr-labels.outputs.base_ref, 'maint-'))
    steps:
      - name: Check hotfix gates
        run: |
          if [ "${{ needs.pr-labels.outputs.build_passed }}" != "true" ]; then
            echo "::error::Hotfix requires CI to pass"
            exit 1
          fi
          if [ "${{ needs.pr-labels.outputs.approved }}" != "true" ]; then
            echo "::error::Hotfix requires approval"
            exit 1
          fi
          echo "Hotfix approved for merge to ${{ github.base_ref }}"
