name: PR Checks

on:
  pull_request:
    branches: [master]
    types: [opened, synchronize, reopened, ready_for_review]
  pull_request_review:
    types: [submitted]

permissions:
  contents: read
  pull-requests: write
  checks: write

env:
  CI: true

jobs:
  ci:
    name: CI
    runs-on: ubuntu-latest
    if: github.event.pull_request.draft == false
    outputs:
      ci_passed: ${{ steps.ci_result.outputs.passed }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Type check
        run: bun run check-types

      - name: Build
        run: bun run build

      - name: Set CI result
        id: ci_result
        if: success()
        run: echo "passed=true" >> $GITHUB_OUTPUT

