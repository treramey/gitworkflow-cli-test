  pr-labels:
    name: pr-labels
    runs-on: ubuntu-latest
    needs: [build]
    if: always()
    env:
      REPO: ${{ github.repository }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_PRIVATE_KEY }}

      - name: Check build status
        id: build_status
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          # If build ran this workflow, use its output
          if [ "${{ needs.build.outputs.passed }}" == "true" ]; then
            echo "passed=true" >> $GITHUB_OUTPUT
          elif [ "${{ needs.build.result }}" == "skipped" ]; then
            # Build skipped (label event) - check if status: ci-passed label exists
            labels=$(gh api repos/$REPO/pulls/$PR_NUMBER --jq '.labels[].name')
            if echo "$labels" | grep -qF "status: ci-passed"; then
              echo "passed=true" >> $GITHUB_OUTPUT
            else
              echo "passed=false" >> $GITHUB_OUTPUT
            fi
          else
            echo "passed=false" >> $GITHUB_OUTPUT
          fi

      - name: Check review status
        id: review_status
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          reviews=$(gh api repos/$REPO/pulls/$PR_NUMBER/reviews)
          # Filter out dismissed approvals
          approved=$(echo "$reviews" | jq '[.[] | select(.state == "APPROVED" and .dismissedAt == null)] | length')
          if [ "$approved" -gt 0 ]; then
            echo "approved=true" >> $GITHUB_OUTPUT
          else
            echo "approved=false" >> $GITHUB_OUTPUT
          fi

      - name: Get PR base ref
        id: pr_info
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          base_ref=$(gh api repos/$REPO/pulls/$PR_NUMBER --jq '.base.ref')
          echo "base_ref=$base_ref" >> $GITHUB_OUTPUT

      - name: Update labels
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          BASE_REF: ${{ steps.pr_info.outputs.base_ref }}
        run: |
          # Build labels (consolidated API calls)
          if [ "${{ steps.build_status.outputs.passed }}" == "true" ]; then
            gh pr edit $PR_NUMBER --repo $REPO \
              --remove-label "status: ci-failed,status: conflict" \
              --add-label "status: ci-passed" 2>/dev/null || true
          else
            gh pr edit $PR_NUMBER --repo $REPO \
              --remove-label "status: ci-passed" \
              --add-label "status: ci-failed" 2>/dev/null || true
          fi

          # Ready for integration (build + approval)
          # Only add env: dev for PRs targeting master (not hotfixes to maint)
          if [ "$BASE_REF" == "master" ]; then
            if [ "${{ steps.build_status.outputs.passed }}" == "true" ] && \
               [ "${{ steps.review_status.outputs.approved }}" == "true" ]; then
              gh pr edit $PR_NUMBER --repo $REPO \
                --remove-label "status: needs-review" \
                --add-label "env: dev" 2>/dev/null || true
            elif [ "${{ steps.review_status.outputs.approved }}" != "true" ]; then
              gh pr edit $PR_NUMBER --repo $REPO \
                --add-label "status: needs-review" 2>/dev/null || true
            else
              gh pr edit $PR_NUMBER --repo $REPO \
                --remove-label "status: needs-review" 2>/dev/null || true
            fi
          else
            # Hotfix PR to maint - skip dev/staging labels, just track review status
            if [ "${{ steps.review_status.outputs.approved }}" != "true" ]; then
              gh pr edit $PR_NUMBER --repo $REPO \
                --add-label "status: needs-review" 2>/dev/null || true
            else
              gh pr edit $PR_NUMBER --repo $REPO \
                --remove-label "status: needs-review" 2>/dev/null || true
            fi
          fi

      - name: Check staging status
        id: staging_status
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          labels=$(gh api repos/$REPO/pulls/$PR_NUMBER --jq '.labels[].name')
          if echo "$labels" | grep -qF "env: staging"; then
            echo "in_staging=true" >> $GITHUB_OUTPUT
          else
            echo "in_staging=false" >> $GITHUB_OUTPUT
          fi

      - name: Update release approval
        id: release_status
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          # Approved for release (build + approval + env: staging)
          if [ "${{ steps.build_status.outputs.passed }}" == "true" ] && \
             [ "${{ steps.review_status.outputs.approved }}" == "true" ] && \
             [ "${{ steps.staging_status.outputs.in_staging }}" == "true" ]; then
            echo "approved=true" >> $GITHUB_OUTPUT
            echo "All gates passed - approved for release"
          else
            echo "approved=false" >> $GITHUB_OUTPUT
            echo "Not ready for release: build=${{ steps.build_status.outputs.passed }} approved=${{ steps.review_status.outputs.approved }} in_staging=${{ steps.staging_status.outputs.in_staging }}"
          fi

    outputs:
      release_approved: ${{ steps.release_status.outputs.approved }}
      build_passed: ${{ steps.build_status.outputs.passed }}
      approved: ${{ steps.review_status.outputs.approved }}
      base_ref: ${{ steps.pr_info.outputs.base_ref }}

  # Merge gate for PRs to master (requires staging)
  # 
  # DESIGN: Creates a separate check "Merge Gate" via API that persists across workflow runs.
  # This job always succeeds (so multiple runs don't create multiple failing checks),
  # but the "Merge Gate" check only shows success when env: staging label exists.
  require-staging-approval:
    name: require-staging-approval
    runs-on: ubuntu-latest
    needs: [pr-labels]
    if: always() && needs.pr-labels.outputs.base_ref == 'master'
    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_PRIVATE_KEY }}

      - name: Update merge gate status
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          RELEASE_APPROVED: ${{ needs.pr-labels.outputs.release_approved }}
          BUILD_PASSED: ${{ needs.pr-labels.outputs.build_passed }}
          REVIEW_APPROVED: ${{ needs.pr-labels.outputs.approved }}
        run: |
          sha="${{ github.event.pull_request.head.sha }}"
          
          if [ "$RELEASE_APPROVED" == "true" ]; then
            state="success"
            description="Ready to merge - all gates passed"
          else
            state="pending"
            description="Waiting: build=$BUILD_PASSED review=$REVIEW_APPROVED staging=false"
          fi
          
          # Update commit status (not check run) - this creates/updates a single status
          gh api repos/${{ github.repository }}/statuses/$sha \
            -X POST \
            -f state="$state" \
            -f context="Merge Gate" \
            -f description="$description"
          
          echo "Merge Gate status: $state - $description"
          
          # Always exit 0 - this job's success/failure is informational only
          # The actual gate is the "Merge Gate" commit status

  # Status summary (informational, never fails)
  merge-status:
    name: merge-status
    runs-on: ubuntu-latest
    needs: [pr-labels]
    if: always() && needs.pr-labels.outputs.base_ref == 'master'
    steps:
      - name: Show merge status
        run: |
          echo "## Merge Status"
          echo ""
          echo "Build passed: ${{ needs.pr-labels.outputs.build_passed }}"
          echo "Code review: ${{ needs.pr-labels.outputs.approved }}"
          echo "Release approved: ${{ needs.pr-labels.outputs.release_approved }}"
          echo ""
          if [ "${{ needs.pr-labels.outputs.release_approved }}" == "true" ]; then
            echo "✓ Ready to merge"
          else
            echo "Flow to merge:"
            echo "  1. Build must pass (type-check + build)"
            echo "  2. Get code review approval"
            echo "  3. Wait for 'env: dev' label (auto-added)"
            echo "  4. Topic merges to dev on next rebuild"
            echo "  5. Release manager promotes to staging"
            echo "  6. 'env: staging' label added"
            echo "  7. Merge allowed"
          fi

  # Merge gate for hotfix PRs to maint (CI + approval only, no staging)
  require-hotfix-approval:
    name: require-hotfix-approval
    runs-on: ubuntu-latest
    needs: [pr-labels]
    if: always() && (needs.pr-labels.outputs.base_ref == 'maint' || startsWith(needs.pr-labels.outputs.base_ref, 'maint-'))
    steps:
      - name: Check hotfix gates
        run: |
          if [ "${{ needs.pr-labels.outputs.build_passed }}" != "true" ]; then
            echo "::error::Hotfix requires CI to pass"
            exit 1
          fi
          if [ "${{ needs.pr-labels.outputs.approved }}" != "true" ]; then
            echo "::error::Hotfix requires approval"
            exit 1
          fi
          echo "Hotfix approved for merge to ${{ github.base_ref }}"
