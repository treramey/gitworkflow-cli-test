name: Hotfix Release

on:
  pull_request:
    branches:
      - maint
      - 'maint-*'
    types: [closed]

permissions:
  contents: write
  pull-requests: write

env:
  GIT_AUTHOR_NAME: github-actions[bot]
  GIT_AUTHOR_EMAIL: github-actions[bot]@users.noreply.github.com
  GIT_COMMITTER_NAME: github-actions[bot]
  GIT_COMMITTER_EMAIL: github-actions[bot]@users.noreply.github.com

jobs:
  hotfix-release:
    name: hotfix-release
    runs-on: ubuntu-latest
    if: github.event.pull_request.merged == true
    outputs:
      version: ${{ steps.bump.outputs.version }}
      tag: ${{ steps.bump.outputs.tag }}
      target_branch: ${{ github.base_ref }}
    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_PRIVATE_KEY }}

      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.base_ref }}
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - name: Configure git
        run: |
          git config user.name "$GIT_AUTHOR_NAME"
          git config user.email "$GIT_AUTHOR_EMAIL"

      - name: Bump patch version
        id: bump
        run: |
          # Get current version from last tag on this branch
          last_tag=$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.0.0")
          current=$(echo "$last_tag" | sed 's/^v//')
          
          # Parse and bump patch
          IFS='.' read -r major minor patch <<< "$current"
          patch=$((patch + 1))
          
          new_version="$major.$minor.$patch"
          echo "version=$new_version" >> $GITHUB_OUTPUT
          echo "tag=v$new_version" >> $GITHUB_OUTPUT
          
          echo "Hotfix version: $current -> $new_version"

      - name: Update package.json and tag
        run: |
          jq ".version = \"${{ steps.bump.outputs.version }}\"" package.json > package.json.tmp
          mv package.json.tmp package.json
          
          git add package.json
          git commit -m "chore: hotfix release v${{ steps.bump.outputs.version }}"
          git tag -a "${{ steps.bump.outputs.tag }}" -m "Hotfix ${{ steps.bump.outputs.version }}"
          
          git push origin ${{ github.base_ref }} --follow-tags

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          gh release create "${{ steps.bump.outputs.tag }}" \
            --title "Hotfix ${{ steps.bump.outputs.version }}" \
            --notes "Hotfix release from \`${{ github.base_ref }}\` branch.

          ## Changes
          - ${{ github.event.pull_request.title }}

          PR: #${{ github.event.pull_request.number }}"

  merge-to-master:
    name: merge-to-master
    runs-on: ubuntu-latest
    needs: hotfix-release
    # Only merge maint → master, not maint-X.Y (older release lines stay separate)
    if: github.base_ref == 'maint'
    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_PRIVATE_KEY }}

      - name: Checkout master
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - name: Configure git
        run: |
          git config user.name "$GIT_AUTHOR_NAME"
          git config user.email "$GIT_AUTHOR_EMAIL"

      - name: Merge maint to master
        run: |
          git fetch origin maint
          
          # Attempt merge - FAIL LOUDLY on conflict (no silent skip)
          if ! git merge origin/maint -m "Merge branch 'maint' into master (hotfix v${{ needs.hotfix-release.outputs.version }})"; then
            echo "::error::Merge conflict detected! Manual resolution required."
            echo ""
            echo "To resolve locally:"
            echo "  git checkout master"
            echo "  git fetch origin"
            echo "  git merge origin/maint"
            echo "  # Resolve conflicts..."
            echo "  git push origin master"
            exit 1
          fi
          
          git push origin master

  build-hotfix:
    name: build-hotfix
    runs-on: ubuntu-latest
    needs: hotfix-release
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.hotfix-release.outputs.tag }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: hotfix-build
          path: |
            apps/web/.output/
            apps/web/.vinxi/
          retention-days: 1

  deploy-hotfix:
    name: deploy-hotfix
    runs-on: ubuntu-latest
    needs: [hotfix-release, build-hotfix]
    # Only deploy current maint, not maint-X.Y (older release lines)
    if: github.base_ref == 'maint'
    environment:
      name: production
      url: https://yourapp.com
    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_PRIVATE_KEY }}

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: hotfix-build
          path: apps/web/

      - name: Deploy to Production
        run: |
          echo "Deploying hotfix v${{ needs.hotfix-release.outputs.version }} to Production..."
          # Add your deployment commands here
          echo "Deployment placeholder - configure your deployment method"

      - name: Post-deployment notification
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          echo "Hotfix ${{ needs.hotfix-release.outputs.version }} deployed to production"
          # Add Slack/Discord notification here if needed
