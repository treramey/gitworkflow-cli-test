name: Promote to Staging

on:
  workflow_dispatch:
    inputs:
      topic_branch:
        description: 'Topic branch to promote (e.g., jd/add-feature)'
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write

env:
  GIT_AUTHOR_NAME: github-actions[bot]
  GIT_AUTHOR_EMAIL: github-actions[bot]@users.noreply.github.com
  GIT_COMMITTER_NAME: github-actions[bot]
  GIT_COMMITTER_EMAIL: github-actions[bot]@users.noreply.github.com

jobs:
  promote:
    name: Promote to Staging
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git
        run: |
          git config user.name "$GIT_AUTHOR_NAME"
          git config user.email "$GIT_AUTHOR_EMAIL"

      - name: Validate topic branch
        id: validate
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          topic="${{ inputs.topic_branch }}"

          # Check branch exists
          if ! git rev-parse --verify "origin/$topic" &>/dev/null; then
            echo "::error::Branch '$topic' does not exist"
            exit 1
          fi

          # Check if already in master (graduated)
          if git merge-base --is-ancestor "origin/$topic" origin/master 2>/dev/null; then
            echo "::error::Branch '$topic' is already in master (graduated)"
            exit 1
          fi

          # Check if in dev
          git fetch origin dev
          if ! git merge-base --is-ancestor "origin/$topic" origin/dev 2>/dev/null; then
            echo "::warning::Branch '$topic' is not in dev yet. Promoting anyway."
          fi

          # Get PR number
          pr_number=$(gh pr list --head "$topic" --json number --jq '.[0].number')
          echo "pr_number=$pr_number" >> $GITHUB_OUTPUT

          echo "Topic '$topic' validated for promotion"

      - name: Merge to staging
        run: |
          topic="${{ inputs.topic_branch }}"

          git fetch origin staging
          git checkout staging

          # Check if already in staging
          if git merge-base --is-ancestor "origin/$topic" HEAD 2>/dev/null; then
            echo "Branch '$topic' is already in staging"
            exit 0
          fi

          # Merge topic to staging
          echo "Merging $topic to staging..."
          git merge --no-ff "origin/$topic" -m "Merge branch '$topic' into staging"

          git push origin staging

      - name: Update PR labels
        if: steps.validate.outputs.pr_number != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          pr_number="${{ steps.validate.outputs.pr_number }}"
          topic="${{ inputs.topic_branch }}"

          # Add in-staging label
          gh pr edit "$pr_number" --add-label "in-staging"

          # Post comment
          gh pr comment "$pr_number" --body "Promoted to **staging** branch.

          - Topic: \`$topic\`
          - Time: $(date -u '+%Y-%m-%d %H:%M UTC')
          - Promoted by: @${{ github.actor }}

          Deploying to Staging environment now..."

  deploy-staging:
    name: Deploy Staging
    runs-on: ubuntu-latest
    needs: promote
    environment:
      name: staging
      url: https://staging.yourapp.com
    steps:
      - name: Checkout staging
        uses: actions/checkout@v4
        with:
          ref: staging

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build

      - name: Deploy to Staging
        run: |
          echo "Deploying to Staging server..."
          # Add your deployment commands here
          echo "Deployment placeholder - configure your deployment method"
